    @page {

      color-adjust: exact !important;

      padding: 0;

      font-size: 14px;
      line-height: 1.4;

      break-after: page;

      break-inside: avoid;
    }

      font-family: "Times New Roman", Times, serif;
      text-align: center;
      padding: 40px;
      color: #78716c;
      font-size: 16px;
    }

    @media print {
      body {
        margin: 0;
        padding: 0;
        background: none;
      }
      .so-page-block {
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
