    <path d="M37 61 Q60 65 83 61 Q86 57 82 56 L38 56 Q34 57 37 61 Z" fill="none" />
    <line x1="42" y1="61" x2="42" y2="69" />
    <line x1="78" y1="61" x2="78" y2="69" />

    <!-- TẦNG 2 -->
    <path d="M34 73 Q60 77 86 73 Q89 69 85 68 L35 68 Q31 69 34 73 Z" fill="none" />
    <line x1="40" y1="73" x2="40" y2="82" />
