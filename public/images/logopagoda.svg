  <!-- Vòng cung hoa văn cổ điển bao quanh tháp -->
  <path
    d="M20 78 A44 44 0 1 1 100 78"
    class="arch-main"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M25 78 A39 39 0 1 1 95 78"
    class="arch-dash"
    stroke-width="1.2"
    stroke-dasharray="3 3"
